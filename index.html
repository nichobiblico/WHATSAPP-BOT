<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f5" />
  <title>Conversación en WhatsApp</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="chat-app" aria-label="Vista previa de conversación en WhatsApp">
    <header class="chat-header">
      <div class="avatar" id="contact-avatar" aria-label="Foto de perfil"></div>
      <div class="contact"><strong id="contact-name"></strong><span id="contact-status"></span></div>
    </header>
    <section class="chat" id="chat" aria-label="Mensajes de la conversación">
      <div class="today">HOY</div>
      <div class="encryption"><span class="lock-icon">▣</span> Los mensajes y las llamadas están protegidos con cifrado de extremo a extremo. Solo las personas que forman parte de esta conversación pueden leerlos, escucharlos o compartirlos. <a href="#" tabindex="-1">Más información</a></div>
      <div id="messages" class="messages" aria-live="polite"></div>
      <div id="typing" class="typing" aria-label="Escribiendo" hidden><span></span><span></span><span></span></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
