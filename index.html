<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f5" />
  <title>Conversación en WhatsApp</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="chat-app" aria-label="WhatsApp">
    <header class="chat-header">
      <div class="avatar" id="contact-avatar" aria-label="Foto de perfil"></div>
      <div class="contact">
        <div class="contact-name-line">
          <strong id="contact-name"></strong>
          <svg class="verified-badge" viewBox="0 0 24 24" role="img" aria-label="Cuenta verificada">
            <path fill="#3897f0" d="m12 1.5 2.1 1.2 2.5-.2 1.2 2.3 2.3 1.2-.2 2.5 1.2 2.1-1.2 2.1.2 2.5-2.3 1.2-1.2 2.3-2.5-.2-2.1 1.2-2.1-1.2-2.5.2-1.2-2.3-2.3-1.2.2-2.5L3 12l1.2-2.1-.2-2.5 2.3-1.2 1.2-2.3 2.5.2z"/>
            <path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m8.2 12.1 2.4 2.4 5.2-5.2"/>
          </svg>
        </div>
        <span id="contact-status"></span>
      </div>
    </header>
    <section class="chat" id="chat" aria-label="WhatsApp chat">
      <div class="today" id="today-label">HOY</div>
      <div class="encryption"><span class="lock-icon">▣</span> <span id="encryption-copy">Los mensajes y las llamadas están protegidos con cifrado de extremo a extremo. Solo las personas que forman parte de esta conversación pueden leerlos, escucharlos o compartirlos.</span> <a id="encryption-more" href="#" tabindex="-1">Más información</a></div>
      <div id="messages" class="messages" aria-live="polite"></div>
      <div id="typing" class="typing" aria-label="Escribiendo" hidden><span></span><span></span><span></span></div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
